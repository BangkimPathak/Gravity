<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity | Create Password</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --background: #090d16;
      --foreground: #f8fafc;
      --card: rgba(15, 23, 42, 0.65);
      --card-foreground: #f8fafc;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-foreground: #ffffff;
      --secondary: rgba(255, 255, 255, 0.06);
      --muted: #64748b;
      --muted-foreground: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(255, 255, 255, 0.04);
      --ring-focus: rgba(129, 140, 248, 0.4);
      --accent-violet: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
    }

    /* Split Screen Layout */
    .app-wrapper {
      display: flex;
      width: 100vw;
      min-height: 100vh;
    }

    /* Left Column: Form Container */
    .left-column {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      z-index: 10;
    }

    .form-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Brand Header */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .brand-logo svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Heading & Description */
    .main-heading {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: #ffffff;
    }

    .main-subtitle {
      font-size: 14px;
      color: var(--muted-foreground);
      line-height: 1.5;
      margin-top: 6px;
    }

    .form-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted-foreground);
    }

    /* Glass Input Wrapper */
    .glass-input-wrapper {
      border-radius: 16px;
      border: 1px solid var(--border);
      background-color: var(--input-bg);
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      position: relative;
      display: flex;
      align-items: center;
    }

    .glass-input-wrapper:focus-within {
      border-color: rgba(129, 140, 248, 0.7);
      background-color: rgba(99, 102, 241, 0.08);
      box-shadow: 0 0 0 3px var(--ring-focus);
    }

    .glass-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 14px;
      padding: 14px 16px;
      color: #ffffff;
      border-radius: 16px;
    }

    .glass-input::placeholder {
      color: rgba(148, 163, 184, 0.5);
    }

    .input-icon-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted-foreground);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .input-icon-btn:hover {
      color: #ffffff;
    }

    /* Primary Submit Button */
    .submit-btn {
      width: 100%;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      margin-top: 4px;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Footer Switch Text */
    .switch-auth-text {
      text-align: center;
      font-size: 13px;
      color: var(--muted-foreground);
      margin-top: 4px;
    }

    .switch-link {
      color: var(--accent-violet);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
    }

    .switch-link:hover {
      text-decoration: underline;
    }

    /* Toast Notification */
    .toast-alert {
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      display: block;
      animation: fadeSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toast-alert.hidden {
      display: none;
    }

    .toast-alert.success {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .toast-alert.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* Right Column: Hero Showcase + Testimonials */
    .right-column {
      display: none;
      flex: 1;
      position: relative;
      padding: 16px;
      min-height: 100vh;
    }

    @media (min-width: 992px) {
      .right-column {
        display: block;
      }
    }

    .hero-image-card {
      position: absolute;
      inset: 16px;
      border-radius: 28px;
      background-image: url('https://images.unsplash.com/photo-1642615835477-d303d7dc9ee9?w=2160&q=80');
      background-size: cover;
      background-position: center;
      overflow: hidden;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.6);
      animation: slideRightIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.1) 0%, rgba(9, 13, 22, 0.75) 100%);
    }

    /* Illustration Showcase Container */
    .illustration-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px;
      z-index: 5;
    }

    .hero-illustration-img {
      max-width: 86%;
      max-height: 86%;
      object-fit: contain;
      border-radius: 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #ffffff;
      padding: 14px;
      animation: testimonialIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideRightIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes testimonialIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .anim-delay-1 { animation-delay: 0.1s; }
    .anim-delay-2 { animation-delay: 0.25s; }
    .anim-delay-3 { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <!-- LEFT COLUMN: CREATE PASSWORD FORM -->
    <section class="left-column">
      <div class="form-container">
        <!-- Brand Header -->
        <header class="brand-header">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.82.49 3.53 1.34 5L2 22l5.24-1.31C8.68 21.49 10.28 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
          </div>
          <h2 class="brand-title">Gravity</h2>
        </header>

        <!-- Heading & Details -->
        <div>
          <h1 class="main-heading">Create Password</h1>
          <p class="main-subtitle">Choose a secure password to complete registration for:<br><strong id="display-email" style="color: #ffffff; font-weight: 600;">email@example.com</strong></p>
        </div>

        <!-- Toast Notification Alert -->
        <div id="toast-message" class="toast-alert hidden"></div>

        <!-- Password Setup Form -->
        <form id="password-setup-form" class="form-content" onsubmit="handlePasswordSubmit(event)">
          <div class="form-group">
            <label class="form-label" for="new-password">Choose Password</label>
            <div class="glass-input-wrapper">
              <input type="password" id="new-password" class="glass-input" required minlength="6" placeholder="Min 6 characters" style="padding-right: 44px;">
              <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('new-password', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <div class="glass-input-wrapper">
              <input type="password" id="confirm-password" class="glass-input" required minlength="6" placeholder="Re-enter password" style="padding-right: 44px;">
              <button type="button" class="input-icon-btn" onclick="togglePasswordVisibility('confirm-password', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="submit-btn">Complete Registration</button>

          <p class="switch-auth-text" style="margin-top: 10px;">
            <a href="/" class="switch-link">&larr; Back to Sign In</a>
          </p>
        </form>
      </div>
    </section>

    <!-- RIGHT COLUMN: HERO SHOWCASE (ILLUSTRATION) -->
    <section class="right-column">
      <div class="hero-image-card">
        <div class="hero-overlay"></div>
        <div class="illustration-container">
          <img src="/assets/reading_illustration.png" alt="Gravity Reading Illustration" class="hero-illustration-img">
        </div>
      </div>
    </section>
  </div>

  <!-- Password Script -->
  <script>
    function showToast(message, type = 'error') {
      const toast = document.getElementById('toast-message');
      toast.textContent = message;
      toast.className = `toast-alert ${type}`;
    }

    function hideToast() {
      const toast = document.getElementById('toast-message');
      toast.className = 'toast-alert hidden';
    }

    function getEmailParam() {
      const urlParams = new URLSearchParams(window.location.search);
      let email = (urlParams.get('email') || '').trim().toLowerCase();
      if (!email) {
        email = (localStorage.getItem('pending_verification_email') || '').trim().toLowerCase();
      }
      return email;
    }

    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    }

    async function handlePasswordSubmit(e) {
      e.preventDefault();
      hideToast();

      const email = getEmailParam();
      const password = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        showToast('Passwords do not match. Please verify and re-enter.', 'error');
        return;
      }

      if (password.length < 6) {
        showToast('Password must be at least 6 characters.', 'error');
        return;
      }

      const form = e.target;
      const submitBtn = form.querySelector('.submit-btn');
      const origText = submitBtn.textContent;
      submitBtn.textContent = 'Setting Password...';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });
        const result = await res.json();

        if (res.ok) {
          showToast(result.message, 'success');
          if (result.access_token) {
            localStorage.setItem('gravity_auth_token', result.access_token);
          }
          setTimeout(() => {
            window.location.href = result.redirect || '/home';
          }, 900);
        } else {
          showToast(result.detail || result.message || 'Failed to create password.', 'error');
        }
      } catch (err) {
        showToast('Network error while saving password.', 'error');
      } finally {
        submitBtn.textContent = origText;
        submitBtn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const email = getEmailParam();
      if (!email) {
        showToast('Invalid session: Email is missing. Redirecting...', 'error');
        setTimeout(() => { window.location.href = '/register'; }, 1000);
        return;
      }
      document.getElementById('display-email').textContent = email;

      try {
        const res = await fetch(`/api/otp-time?email=${encodeURIComponent(email)}`);
        const data = await res.json();
        if (res.ok && data.status === 'success') {
          if (data.otp_status === 'COMPLETED') {
            showToast('Account registration already completed. Please sign in.', 'success');
            setTimeout(() => { window.location.href = '/login'; }, 1000);
          } else if (data.otp_status !== 'VERIFIED') {
            showToast('Please verify your email code first.', 'error');
            setTimeout(() => { window.location.href = `/verify-otp?email=${encodeURIComponent(email)}`; }, 1000);
          }
        }
      } catch (e) {
        console.error(e);
      }
    });
  </script>
</body>
</html>
